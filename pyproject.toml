[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-package-copier"
dynamic = ["version"]
description = "A modern Python package template using copier"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
pytest = "pytest:console_main"

[dependency-groups]
dev = [
    {include-group = "tests"},
    {include-group = "lint"},
    {include-group = "docs"},
    {include-group = "fix"},
]
tests = [
    "copier>=9.17.0",
    # The docs-build tests exercise the markdown extensions (which import
    # `markdown`) and build via mkdocs in the integration tests, so mkdocs must
    # be importable from the test env.
    "mkdocs>=1.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.8",
    "covdefaults>=2.3",
    # A generated project is format-checked with ruff (test_generated_project_is
    # _ruff_format_clean): the template's Python lives in .jinja files that ruff
    # never sees here, so unformatted code ships and a generated project's first
    # hook run reformats template-owned files and reds its CI. Pinned to
    # match the lint group so the check agrees with what a project would run.
    "ruff>=0.15.22",
]
lint = [
    "interrogate>=1.7.0",
    "ruff>=0.15.22",
    "rumdl>=0.2.38",
]
docs = [
    # Zensical (successor to Material for MkDocs) builds this repo's own docs;
    # mkdocs-material is kept for the CI comparison build during the transition.
    "zensical>=0.0.51",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
fix = [
  # prek runs the hooks. Pinned here, never invoked via `uvx`: prek substitutes its
  # own Rust implementations for the `repo: builtin` hooks, so an unpinned prek would
  # mean unpinned hook code -- exactly what the config comment below rules out.
  "prek>=0.4.10",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--color=yes",
    "--tb=short",
    "-ra",
]
filterwarnings = [
    "ignore::copier._vcs.DirtyLocalWarning",
    "ignore::DeprecationWarning:pathspec",
]
markers = [
    "integration: marks tests as integration tests that run subprocesses (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["tests"]
omit = [
    "tests/__pycache__/*",
    "tests/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py313"
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # Pylint
    "S",   # flake8-bandit (security)
    "T10", # flake8-debugger
    "T201", # Print statement
]
ignore = [
    "E203",   # space before : (needed for how black formats slicing)
    "E501",   # line too long (handled by formatter)
    "PLC0415", # import not at top-level (lazy imports are intentional, e.g. noxfile sessions)
    "PLR0913", # too many args in func def
    "PLR0915", # too many statements
    "PLR0912", # too many branches
    "PLR2004", # magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T201", "PLR2004", "PLC0415", "S101", "S603", "S607", "S506"]  # asserts, subprocess to git/uv/copier, and yaml.load of generated files are expected in the template test harness

[tool.rumdl]
flavor = "mkdocs"
line-length = 120
disable = [
    "MD012",  # Multiple consecutive blank lines (common in generated content)
    "MD013",  # Line length (handled by formatter, many long URLs/tables)
    "MD022",  # Heading blank lines (varies by document style)
    "MD031",  # No blank line before fenced code block
    "MD032",  # List should be preceded by blank line
    "MD033",  # Inline HTML (needed for README badges, MkDocs features)
    "MD034",  # URL/email without angle brackets
    "MD045",  # Image missing alt text (logos use empty alt intentionally)
    "MD046",  # Code block style (indented blocks required inside MkDocs tabs)
    "MD051",  # Link fragments (cross-doc references resolved at MkDocs build time)
]
exclude = ["CHANGELOG.md", "template", "site", "htmlcov", ".nox", ".venv"]

[tool.rumdl.per-file-ignores]
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]  # PR template starts with checklist
".github/skills/**" = ["MD007"]  # Nested lists in skill files use variable indent
# Same files, same reason. The exemption was written when only the Copilot copy
# was tracked; .claude/skills was gitignored, so it never needed one and the
# asymmetry was invisible. Tracking the copy Claude Code actually reads made the
# two mirrors lint differently despite being byte-identical.
".claude/skills/**" = ["MD007"]
"README.md" = ["MD041"]  # README starts with badges, not heading
"docs/index.md" = ["MD041"]  # Landing page starts with logo, not heading

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
version_provider = "scm"
update_changelog_on_bump = false
major_version_zero = true
tag_format = "v$version"
