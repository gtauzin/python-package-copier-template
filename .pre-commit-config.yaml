# `install` creates only the pre-commit hook unless told otherwise, so any hook pinned to
# another stage would be declared but never installed -- the gate would exist on paper and
# never run (as commitizen's `commit-msg` hook once did). Naming every stage here is what
# makes `prek install` wire up the commit-msg hook that validates a single-commit PR's
# message and the pre-push hook (interrogate) that gates before a push.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # prek's built-in Rust implementations, declared explicitly. Pointing these at
  # pre-commit/pre-commit-hooks would be a lie: prek swaps its builtins in for that
  # repo's hooks and ignores `rev` while doing it, so the pin would govern nothing.
  # What actually pins these is prek's own version in uv.lock.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # uv.lock is an intentionally-tracked generated lockfile that exceeds the 500 KB default.
        exclude: ^uv\.lock$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Enforce conventional commit messages
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.3.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Secret scanning: block secrets before they enter history. prek runs the official
  # gitleaks hook (its golang language is supported). The gitleaks CI job is the
  # un-bypassable backstop; this hook is the earliest catch, so it stays at pre-commit
  # even though the refusing whole-project hooks (interrogate) run at pre-push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # Version-sensitive linters run from the project environment so their single
  # source of truth is uv.lock. --locked makes a stale uv.lock fail loudly
  # instead of silently diverging from CI. (Dependabot's "uv" ecosystem then
  # keeps them updated in lockstep; nothing floats on a frozen pre-commit rev.)
  #
  # That last clause is now literally true: every hook above resolves from uv.lock,
  # via prek's version for the builtins and via `uv run --locked` for these. The one
  # exception is commitizen, which has no builtin and no reason to live in the dev
  # environment -- it runs at commit-msg only, so prek builds its env lazily rather
  # than every contributor paying 16 packages for it.
  - repo: local
    hooks:
      # Docstring coverage.
      #
      # Skill scripts are excluded: they are illustrative payloads inside a skill,
      # not code this repo ships, and interrogate scores a *pooled* average across
      # everything it is handed. backport-commit/scripts/example.py sits at 50% and
      # only ever passed by being averaged against noxfile.py -- so tracking the
      # second (byte-identical) copy of it under .claude/skills dropped the pool
      # below the gate. A threshold that moves when you copy a file is measuring the
      # pool, not the code; excluding both copies leaves the gate on what it is for.
      # Runs at pre-push, not pre-commit: interrogate scores a pooled average across
      # the whole package, so it gives no per-commit signal and only refuses commits /
      # trips on old code during a rebase. pre-push runs it once before sharing.
      - id: interrogate
        name: interrogate
        entry: uv run --locked interrogate
        language: system
        types: [python]
        exclude: ^(tests/|\.claude/skills/|\.github/skills/|.*_version\.py$|.*\{%.*%\}.*)
        require_serial: true
        stages: [pre-push]

      # Ruff linter (autofix)
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # Ruff formatter
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # Markdown linter
      - id: rumdl
        name: rumdl check
        entry: uv run --locked rumdl check .
        language: system
        types: [markdown]
        pass_filenames: false
        require_serial: true

      # Markdown formatter (fixes fixable violations, fails on the rest)
      - id: rumdl-fmt
        name: rumdl format
        entry: uv run --locked rumdl check --fix .
        language: system
        types: [markdown]
        pass_filenames: false
        require_serial: true
