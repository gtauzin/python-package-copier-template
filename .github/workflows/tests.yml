name: Tests

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default: read-only token. No job here writes.
permissions:
  contents: read

jobs:
  # Fast tests run on every push and PR across all OS and Python versions
  test-fast:
    name: Fast tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Draft PRs: Ubuntu only, min+max Python versions (2 jobs)
        # Ready PRs: All OS, min+max Python versions (6 jobs)
        os: ${{ github.event.pull_request.draft && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Add .local/bin to Windows PATH
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >> $GITHUB_PATH

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run fast tests (excluding slow/integration tests)
        # renovate: datasource=pypi depName=nox
        run: uvx nox@2026.7.11 -s test_fast-${{ matrix.python-version }}

  # Full test suite runs on Ubuntu when PR is not draft or on main branch
  test-full:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run all tests
        # renovate: datasource=pypi depName=nox
        run: uvx nox@2026.7.11 -s test-${{ matrix.python-version }}

  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Run hooks with nox
        run: |
          # renovate: datasource=pypi depName=nox
          uvx nox@2026.7.11 -s fix

  # Secret scanning. Runs the gitleaks binary directly (not gitleaks-action, which
  # requires a paid license for private org repos). It is a dependency of the ci-passed
  # roll-up below, so a detected secret fails the single required merge check.
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose

  # Single required status check. The branch ruleset requires this one job, not the
  # individual jobs above: test-fast is a matrix (its check-run names vary by OS/Python and
  # differ between draft and ready PRs) and test-full is skipped on draft PRs, so neither
  # can be named directly in a ruleset. This job depends on every blocking job and passes
  # only when they all succeeded or were legitimately skipped, giving the ruleset one stable
  # name that survives matrix and conditional changes. Validate PR Title and Validate Commit
  # Message live in their own workflows and are required alongside this check.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - test-fast
      - test-full
      - lint
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required CI job failed or was cancelled"
          exit 1
      - name: All required jobs passed
        run: echo "All required CI jobs passed or were legitimately skipped."
